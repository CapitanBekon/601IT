<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insecure Storefront</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Storefront</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/store/secure/">Secure</a></li>
            <li class="nav-item"><a class="nav-link" href="/store/insecure/">Insecure</a></li>
            <li class="nav-item"><a class="nav-link" href="/cart/">Cart</a></li>
            {% if request.user.is_authenticated %}
              <li class="nav-item"><a class="nav-link" href="/logout/">Logout ({{ request.user.username }})</a></li>
            {% else %}
              <li class="nav-item"><a class="nav-link" href="/register/">Register</a></li>
            {% endif %}
            {% if request.user.is_superuser %}
              <li class="nav-item"><a class="nav-link" href="/dashboard/">Admin</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
