{% extends 'base.html' %}
{% block content %}
<h2>Insecure Login</h2>
<p class="text-danger">Warning: This form is vulnerable to SQL Injection.</p>
<!-- Insecure: No CSRF token -->
<form method="post" action="/login/insecure/">
    <div class="mb-3">
        <label>Username</label>
        <input type="text" name="username" class="form-control">
    </div>
    <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control">
    </div>
    <button type="submit" class="btn btn-danger">Login (Insecure)</button>
</form>
{% if error %}<div class="alert alert-warning mt-3">{{ error }}</div>{% endif %}
{% endblock %}
